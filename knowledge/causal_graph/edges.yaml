# 故障因果知识图谱 —— 边
#
# 为什么必须是图而不是向量库：故障是连锁的。
#   autovacuum 停摆 -> 死元组堆积 -> 表膨胀 -> 磁盘涨 -> 停库
#   autovacuum 停摆 -> 冻结不及时 -> XID 回卷风险（另一条独立分支）
# 告警端看到的是"磁盘满"，真根因在三跳之外。向量相似度永远找不到三跳外的
# 东西，图遍历可以。

# 根因 -> 症状。likelihood 是"该根因导致此症状"的条件概率。
causes_symptom:
  - {from: missing_index,         to: latency_p99_up,  likelihood: 0.95}
  - {from: missing_index,         to: cpu_saturated,   likelihood: 0.85}
  - {from: missing_index,         to: throughput_down, likelihood: 0.60}
  - {from: stale_statistics,      to: latency_p99_up,  likelihood: 0.85}
  - {from: stale_statistics,      to: cpu_saturated,   likelihood: 0.60}
  - {from: lock_contention,       to: latency_p99_up,  likelihood: 0.90}
  - {from: lock_contention,       to: queries_blocked, likelihood: 0.95}
  - {from: lock_contention,       to: throughput_down, likelihood: 0.80}
  - {from: table_bloat,           to: latency_p99_up,  likelihood: 0.70}
  - {from: table_bloat,           to: disk_growing,    likelihood: 0.85}
  - {from: connection_exhaustion, to: throughput_down, likelihood: 0.90}
  - {from: connection_exhaustion, to: conn_near_limit, likelihood: 0.98}
  - {from: connection_exhaustion, to: latency_p99_up,  likelihood: 0.55}
  - {from: long_idle_transaction, to: queries_blocked, likelihood: 0.70}
  - {from: disk_pressure,         to: disk_growing,    likelihood: 0.95}
  - {from: xid_wraparound_risk,   to: disk_growing,    likelihood: 0.40}
  # 手册：复制槽会同时滞留 WAL 与 xmin，磁盘涨的是 pg_wal 而不是表
  - {from: stale_replication_slot, to: disk_growing,   likelihood: 0.90,
     source: pgdoc:routine-vacuuming}
  - {from: deadlock,              to: throughput_down, likelihood: 0.75,
     source: pgdoc:explicit-locking,
     note: "死锁被检测到即中止其中一个事务，表现为事务失败率上升"}
  - {from: deadlock,              to: queries_blocked, likelihood: 0.50,
     source: pgdoc:explicit-locking}
  # 外溢到临时文件 = 本该在内存做的排序/哈希改走磁盘
  - {from: work_mem_spill,        to: latency_p99_up,  likelihood: 0.80,
     source: pgdoc:monitoring-stats}
  - {from: work_mem_spill,        to: disk_growing,    likelihood: 0.45,
     source: pgdoc:monitoring-stats}
  - {from: checkpoint_pressure,   to: latency_p99_up,  likelihood: 0.55,
     source: pgdoc:monitoring-stats}
  - {from: autovacuum_starvation, to: autovacuum_unhealthy, likelihood: 0.99,
     note: "表级 autovacuum 关闭或持续落后会直接触发健康告警"}

# 根因 -> 根因（级联）。这是图相对查找表的不可替代之处。
causes_cause:
  - {from: autovacuum_starvation, to: table_bloat,         likelihood: 0.85,
     note: "死元组无人回收，表持续膨胀"}
  - {from: autovacuum_starvation, to: xid_wraparound_risk, likelihood: 0.45,
     note: "冻结不及时，XID 年龄持续增长"}
  - {from: long_idle_transaction, to: autovacuum_starvation, likelihood: 0.75,
     note: "长事务持有快照，vacuum 无法回收其后产生的死元组"}
  - {from: table_bloat,           to: disk_pressure,       likelihood: 0.55}
  # 误导性告警的来源之一：一批 idle in transaction 的会话占满连接槽，
  # 表面症状与真·连接打满完全一样。做成级联而非直连 conn_near_limit ——
  # 因果上本来就隔着一层，而且这样真根因离告警两跳，只看告警那一跳
  # 永远查不到。
  - {from: long_idle_transaction, to: connection_exhaustion, likelihood: 0.65,
     note: "未提交的事务不释放连接，堆积到一定数量即占满连接池"}
  # 手册 Routine Vacuuming 的要点：挡住 vacuum 的不只是长事务。
  # 复制槽与预备事务同样持住 xmin，而且比长事务更隐蔽 —— 它们不在
  # pg_stat_activity 里，只看会话列表永远发现不了。
  - {from: stale_replication_slot, to: autovacuum_starvation, likelihood: 0.80,
     source: pgdoc:routine-vacuuming,
     note: "槽持住 xmin，其后产生的死元组一律回收不掉"}
  - {from: orphaned_prepared_transaction, to: autovacuum_starvation,
     likelihood: 0.75, source: pgdoc:routine-vacuuming}
  - {from: orphaned_prepared_transaction, to: xid_wraparound_risk,
     likelihood: 0.55, source: pgdoc:routine-vacuuming,
     note: "预备事务的 XID 一直不释放，datfrozenxid 推不动"}
  - {from: stale_replication_slot, to: xid_wraparound_risk, likelihood: 0.45,
     source: pgdoc:routine-vacuuming}

# 根因 <- 确认证据。necessity=required 的是硬要求：
# 证据充分性检查的 D1 直接读这里，缺一即判 INSUFFICIENT。
confirmed_by:
  - {cause: missing_index,  evidence: explain_seq_scan,   necessity: required}
  - {cause: missing_index,  evidence: index_existence,    necessity: required}
  - {cause: missing_index,  evidence: counterfactual_index, necessity: supporting}
  # 统计过期的判别特征是估计与实际的偏差，不是时间戳。实测偏差 4200 倍
  # 而 last_analyze 看着是新的（刚灌完数据、autovacuum 被关）。
  - {cause: stale_statistics, evidence: row_estimate_deviation, necessity: required}
  - {cause: stale_statistics, evidence: stats_freshness,  necessity: supporting}
  - {cause: lock_contention,  evidence: lock_blocking_chain, necessity: required}
  - {cause: lock_contention,  evidence: session_wait_profile, necessity: supporting}
  # dead_tuple_ratio 只描述清理压力，不能替代物理空间测量。
  - {cause: table_bloat,      evidence: dead_tuple_ratio, necessity: supporting}
  - {cause: table_bloat,      evidence: physical_bloat_ratio, necessity: required}
  - {cause: connection_exhaustion, evidence: connection_count, necessity: required}
  - {cause: long_idle_transaction, evidence: session_wait_profile, necessity: required}
  - {cause: long_idle_transaction, evidence: idle_in_transaction, necessity: required}
  - {cause: autovacuum_starvation, evidence: autovacuum_health,
     necessity: required}
  # xid_wraparound_risk 与 disk_pressure 此前一条确认证据都没有 ——
  # 图上有这个节点，却没有任何办法确认它，等于只能靠猜。
  - {cause: xid_wraparound_risk, evidence: xid_age, necessity: required}
  - {cause: xid_wraparound_risk, evidence: backend_xmin_age, necessity: supporting}
  - {cause: stale_replication_slot, evidence: replication_slot_age,
     necessity: required}
  - {cause: orphaned_prepared_transaction, evidence: prepared_xact_age,
     necessity: required}
  - {cause: deadlock, evidence: deadlock_count, necessity: required}
  - {cause: deadlock, evidence: session_wait_profile, necessity: supporting}
  - {cause: work_mem_spill, evidence: temp_file_volume, necessity: required}
  - {cause: checkpoint_pressure, evidence: checkpoint_stats, necessity: required}
  - {cause: autovacuum_starvation, evidence: backend_xmin_age,
     necessity: supporting}
  - {cause: long_idle_transaction, evidence: backend_xmin_age,
     necessity: supporting}
  - {cause: disk_pressure, evidence: disk_usage, necessity: required}
  # slow_query_ranking 此前是孤点：get_top_queries 产出它、ESC 的 D4 也在
  # 找它，图上却一条边都没有 —— 等于 agent 查了也白查。它的作用是定位
  # "是哪条查询在慢"，对查询级的三类根因都是佐证。
  - {cause: missing_index,    evidence: slow_query_ranking, necessity: supporting}
  - {cause: stale_statistics, evidence: slow_query_ranking, necessity: supporting}
  - {cause: work_mem_spill,   evidence: slow_query_ranking, necessity: supporting}

# 根因 <- 反证证据：拿到这条证据即可排除该根因
refuted_by:
  - {cause: stale_statistics, evidence: row_estimate_deviation,
     predicate_id: row_estimate_deviation_v2, scope: NODE,
     when: "估计与实际行数偏差不大"}
  - {cause: lock_contention,  evidence: lock_blocking_chain,
     predicate_id: lock_blocking_chain_v2, scope: PATH, window_required: true,
     when: "阻塞链为空"}
  - {cause: missing_index,    evidence: explain_plan,
     predicate_id: explain_plan_v2, scope: PATH,
     when: "执行计划已走索引"}
  - {cause: table_bloat,      evidence: physical_bloat_ratio,
     predicate_id: physical_bloat_ratio_v2, scope: NODE,
     when: "结构化物理测量显示可回收比例很低"}
  - {cause: connection_exhaustion, evidence: connection_count,
     predicate_id: connection_count_v2, scope: PATH,
     when: "连接数远低于上限"}
  - {cause: long_idle_transaction, evidence: idle_in_transaction,
     predicate_id: idle_in_transaction_v2, scope: PATH,
     when: "idle in transaction 会话数接近 0"}
  # 反事实模拟是 DB 域独有的反证手段：不碰生产就能预先否掉一个方案。
  # _supports 早就实现了这条判断，图上一直没有对应的边 —— 而 D2 判
  # "这次排除有没有依据"是照着图查的，缺边就等于这条反证不算数。
  - {cause: missing_index, evidence: counterfactual_index,
     predicate_id: counterfactual_index_v2, scope: INTERVENTION,
     target_fix: create_covering_index,
     when: "hypopg 模拟显示优化器不会采用该索引"}
  - {cause: checkpoint_pressure, evidence: checkpoint_stats,
     predicate_id: checkpoint_stats_v2, scope: PATH, window_required: true,
     when: "请求式检查点占比不高，写入时间正常"}
  - {cause: xid_wraparound_risk, evidence: xid_age,
     predicate_id: xid_age_v2, scope: NODE,
     when: "XID 年龄远低于 autovacuum_freeze_max_age"}
  - {cause: stale_replication_slot, evidence: replication_slot_age,
     predicate_id: replication_slot_age_v2, scope: NODE,
     when: "没有复制槽，或槽的 xmin 年龄很小"}
  - {cause: orphaned_prepared_transaction, evidence: prepared_xact_age,
     predicate_id: prepared_xact_age_v2, scope: NODE,
     when: "pg_prepared_xacts 为空"}
  - {cause: deadlock, evidence: deadlock_count,
     predicate_id: deadlock_count_v2, scope: PATH, window_required: true,
     when: "故障窗口内 deadlocks 计数没有增长"}
  - {cause: work_mem_spill, evidence: temp_file_volume,
     predicate_id: temp_file_volume_v2, scope: PATH, window_required: true,
     when: "temp_bytes 为 0，没有任何外溢"}
  - {cause: autovacuum_starvation, evidence: autovacuum_health,
     predicate_id: autovacuum_health_v2, scope: NODE,
     when: "autovacuum 有效启用，且没有超过触发阈值的积压"}
  - {cause: disk_pressure, evidence: disk_usage,
     predicate_id: disk_usage_v2, scope: NODE,
     when: "数据目录所在文件系统使用率低于告警阈值"}

# 一条证据能一次分开哪几个候选 —— 驱动"下一步查什么最划算"。
# 取证预算有限时，优先做信息增益最大的那次查询。
discriminates:
  - {evidence: explain_seq_scan,
     separates: [missing_index, stale_statistics], power: 0.8}
  - {evidence: stats_freshness,
     separates: [stale_statistics, missing_index, autovacuum_starvation], power: 0.9}
  - {evidence: lock_blocking_chain,
     separates: [lock_contention, long_idle_transaction, missing_index], power: 0.95}
  - {evidence: index_existence,
     separates: [missing_index, stale_statistics], power: 0.85}
  - {evidence: dead_tuple_ratio,
     separates: [table_bloat, autovacuum_starvation, missing_index], power: 0.8}
  - {evidence: connection_count,
     separates: [connection_exhaustion, lock_contention], power: 0.9}
  # 真·连接打满与长事务堆积在连接数上完全一样，分开它们的只有会话状态：
  # 前者是 idle，后者是 idle in transaction。这条判别力最高，因为它是
  # 唯一的区分点 —— 漏了它就只能靠猜。
  - {evidence: idle_in_transaction,
     separates: [long_idle_transaction, connection_exhaustion], power: 0.95}
  # 挡住 vacuum 的三个持有者表象完全一样（都是"死元组回收不掉"），
  # 但处置方式完全不同：终止会话 / 丢弃复制槽 / 了结预备事务。
  # 这条边的价值在于它一次把三者分开。
  - {evidence: backend_xmin_age,
     separates: [long_idle_transaction, stale_replication_slot,
                 orphaned_prepared_transaction], power: 0.90,
     source: pgdoc:routine-vacuuming}
  # 死锁与普通锁等待表象相似（都是查询挂住），但死锁会被自动中止，
  # 计数器会涨；锁等待不会。这是唯一能机械区分的判据。
  - {evidence: deadlock_count,
     separates: [deadlock, lock_contention], power: 0.92,
     source: pgdoc:explicit-locking}
  - {evidence: temp_file_volume,
     separates: [work_mem_spill, missing_index, stale_statistics], power: 0.75,
     source: pgdoc:monitoring-stats}
  - {evidence: xid_age,
     separates: [xid_wraparound_risk, table_bloat], power: 0.85,
     source: pgdoc:routine-vacuuming}
  # 判别力刻意给得低：它只能告诉你"哪条查询慢"，分不出慢的原因
  - {evidence: slow_query_ranking,
     separates: [missing_index, stale_statistics, work_mem_spill], power: 0.45}

# 根因 -> 修复。risk_tier 是给安全门的先验，门仍会独立评估。
fixed_by:
  - {cause: missing_index,        fix: create_covering_index}
  - {cause: stale_statistics,     fix: analyze_table}
  - {cause: table_bloat,          fix: vacuum_table}
  - {cause: lock_contention,      fix: terminate_blocker}
  - {cause: long_idle_transaction, fix: terminate_idle_transaction}
  - {cause: autovacuum_starvation, fix: enable_autovacuum}
  # connection_exhaustion / xid_wraparound_risk / disk_pressure 此前
  # 一个修复都没挂 —— 诊断得出来也不知道该干什么。
  - {cause: connection_exhaustion, fix: terminate_idle_backend}
  - {cause: xid_wraparound_risk,   fix: vacuum_database}
  # 普通 VACUUM 只把空间归还给表内复用，不会把文件缩回文件系统，不能
  # 当作磁盘压力修复。存储处置依赖平台与数据保留策略，只能升级人工。
  - {cause: disk_pressure,         fix: remediate_disk_capacity}
  - {cause: stale_replication_slot, fix: drop_replication_slot}
  - {cause: orphaned_prepared_transaction, fix: resolve_prepared_xact}
  - {cause: work_mem_spill,        fix: raise_work_mem}
  - {cause: deadlock,              fix: remediate_deadlock_pattern}
  - {cause: checkpoint_pressure,   fix: raise_max_wal_size}
