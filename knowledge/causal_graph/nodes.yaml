# 故障因果知识图谱 —— 节点
#
# 手工种子骨架。这部分必须手工写，因为它是 ground truth 的一部分：
# 让模型生成因果边等于让被考核者出考题。文档抽取只能用来扩充，且必须人工校验
# —— 一条错的 CAUSES 边会系统性地毒化所有相关诊断。
#
# Evidence 节点的 id 必须与 Toolbox 实际产出的 evidence_type 严格一致，
# 否则证据充分性检查无法机械核验，只能退化成看模型自述。

symptoms:
  - id: latency_p99_up
    desc: 查询 p99 延迟显著上升
    measured_by: p99_ms
  - id: cpu_saturated
    desc: CPU 占用饱和
    measured_by: cpu_pct
  - id: conn_near_limit
    desc: 连接数逼近上限
    measured_by: connections
  - id: disk_growing
    desc: 磁盘占用持续增长
    measured_by: disk_pct
  - id: queries_blocked
    desc: 查询挂起不返回
    measured_by: blocked_sessions
  - id: throughput_down
    desc: 吞吐下降
    measured_by: qps

root_causes:
  - id: missing_index
    desc: 缺少可用索引，谓词无法走索引导致全表扫
    prior: 0.35
    fix_hint: 补上覆盖该谓词的索引
  - id: stale_statistics
    desc: 统计信息过期，优化器选了坏计划
    prior: 0.15
  - id: lock_contention
    desc: 锁等待，存在阻塞链
    prior: 0.15
  - id: table_bloat
    desc: 表膨胀，死元组堆积导致扫描变慢
    prior: 0.12
  - id: autovacuum_starvation
    desc: autovacuum 跟不上或被关闭
    prior: 0.08
  - id: connection_exhaustion
    desc: 连接池打满，新连接被拒
    prior: 0.08
  - id: long_idle_transaction
    desc: 长事务 idle in transaction，挡住 vacuum 与其他会话
    prior: 0.07
  - id: xid_wraparound_risk
    desc: 事务 ID 逼近回卷上限，属灾难级
    prior: 0.02
  - id: disk_pressure
    desc: 磁盘空间不足
    prior: 0.03

  # ── 以下按 PostgreSQL 官方手册扩充，每条都记了出处 ──────────
  # 手册 Routine Vacuuming 把"死元组回收不掉"归到同一个机制：只要还有
  # 事务可能看见旧版本，VACUUM 就不能删。它列了四个 xmin 持有者，长事务
  # 只是其中一个 —— 图上原来只有长事务，等于漏掉了另外两类真凶。
  - id: stale_replication_slot
    desc: 陈旧的复制槽持住 xmin 与 WAL，vacuum 回收不掉死元组
    prior: 0.04
    source: pgdoc:routine-vacuuming
    doc_quote: "Drop any old replication slots. Use pg_replication_slots to
      find slots where age(xmin) or age(catalog_xmin) is large."
  - id: orphaned_prepared_transaction
    desc: 未了结的两阶段提交事务长期挂着，同样挡住冻结
    prior: 0.02
    source: pgdoc:routine-vacuuming
    doc_quote: "Resolve old prepared transactions. You can find these by
      checking pg_prepared_xacts for rows where age(transactionid) is large."
  - id: deadlock
    desc: 死锁，PostgreSQL 自动中止其中一个事务
    prior: 0.05
    source: pgdoc:explicit-locking
    doc_quote: "PostgreSQL automatically detects deadlock situations and
      resolves them by aborting one of the transactions involved."
  - id: work_mem_spill
    desc: work_mem 不足，排序/哈希外溢到临时文件
    prior: 0.06
    source: pgdoc:monitoring-stats
  - id: checkpoint_pressure
    desc: 检查点被频繁请求触发，WAL 涨得比 checkpoint_timeout 快
    prior: 0.04
    source: pgdoc:monitoring-stats

# 证据类型 —— id 与 Toolbox 的 evidence_type 一一对应
evidence:
  - id: explain_seq_scan
    desc: EXPLAIN 显示 Seq Scan 且过滤掉大量行
    obtained_by: explain_query
  - id: explain_plan
    desc: EXPLAIN 显示走了索引
    obtained_by: explain_query
  - id: index_existence
    desc: pg_indexes 上是否存在可覆盖该谓词的索引
    obtained_by: get_indexes
  - id: stats_freshness
    desc: last_analyze 是否新鲜
    obtained_by: get_table_stats
  - id: row_estimate_deviation
    desc: EXPLAIN 里估计行数与实际行数的偏差倍数。统计过期的真正判别
      特征 —— 时间戳"看着新"也可能因为刚灌过数据而严重失真
    obtained_by: explain_query
  - id: lock_blocking_chain
    desc: pg_locks 阻塞链，谁挡住了谁
    obtained_by: get_blocking_chain
  - id: session_wait_profile
    desc: 活动会话的等待事件分布
    obtained_by: get_active_sessions
  - id: slow_query_ranking
    desc: pg_stat_statements 里按累计耗时排序的慢查询
    obtained_by: get_top_queries
  - id: counterfactual_index
    desc: hypopg 模拟索引后优化器是否改用它、成本降幅多少
    obtained_by: simulate_index
  - id: dead_tuple_ratio
    desc: 死元组占比
    obtained_by: get_table_stats
  - id: idle_in_transaction
    desc: 处于 idle in transaction 的会话数
    obtained_by: get_connection_stats
  - id: connection_count
    desc: 当前连接数与上限、按状态与角色的分布
    obtained_by: get_connection_stats

  # ── 两个新工具产出的证据类型 ────────────────────────────────
  # 每一条都必须真有工具能产出，否则 ESC 只能退化成看模型自述 ——
  # 这是本文件开头那条约束，扩图时最容易破的也是它。
  - id: xid_age
    desc: 数据库与最老表的 XID 年龄，以及占 autovacuum_freeze_max_age 的比例
    obtained_by: get_vacuum_horizon
    source: pgdoc:routine-vacuuming
  - id: replication_slot_age
    desc: 各复制槽的 age(xmin) / age(catalog_xmin) 与是否 active
    obtained_by: get_vacuum_horizon
    source: pgdoc:routine-vacuuming
  - id: prepared_xact_age
    desc: pg_prepared_xacts 里各预备事务的 age(transactionid)
    obtained_by: get_vacuum_horizon
    source: pgdoc:routine-vacuuming
  - id: backend_xmin_age
    desc: 最老的 backend_xmin 年龄 —— 谁在挡着 xmin 视界前进
    obtained_by: get_vacuum_horizon
    source: pgdoc:routine-vacuuming
  - id: deadlock_count
    desc: pg_stat_database.deadlocks 累计死锁数
    obtained_by: get_database_stats
    source: pgdoc:monitoring-stats
  - id: temp_file_volume
    desc: pg_stat_database.temp_files / temp_bytes，排序哈希外溢量
    obtained_by: get_database_stats
    source: pgdoc:monitoring-stats
  - id: checkpoint_stats
    desc: 定时与请求式检查点的次数与耗时，请求式占比
    obtained_by: get_database_stats
    source: pgdoc:monitoring-stats

fixes:
  - id: create_covering_index
    action_type: create_index
    risk_tier: CONFIRM
    template: "CREATE INDEX CONCURRENTLY {name} ON {table}({cols})"
    rollback: "DROP INDEX CONCURRENTLY {name}"
  - id: analyze_table
    action_type: vacuum_analyze
    risk_tier: AUTO
    template: "ANALYZE {table}"
    rollback: "SELECT 1"
  - id: vacuum_table
    action_type: vacuum_analyze
    risk_tier: CONFIRM
    template: "VACUUM ANALYZE {table}"
    rollback: "SELECT 1"
  - id: terminate_blocker
    action_type: session_control
    risk_tier: CONFIRM
    # 只终止链条最上游的持锁者（pg_blocking_pids 为空的那个）——
    # 链上其余会话多是被牵连的正常业务连接，一并终止是误伤
    template: "SELECT pg_terminate_backend({pid})"
    # 终止会话撤不回来。写个假的回滚语句只会制造"以为能回滚"的错觉，
    # 所以要求显式声明不可逆，由人来担这个责任。
    rollback: "IRREVERSIBLE"
  - id: enable_autovacuum
    action_type: alter_table_options
    risk_tier: CONFIRM
    template: "ALTER TABLE {table} SET (autovacuum_enabled = true)"
    rollback: "ALTER TABLE {table} SET (autovacuum_enabled = false)"

  # ── 补上三个"诊断得出来却没法修"的根因 ─────────────────────
  # 手册明确说了要用哪种 VACUUM：不能用 VACUUM FULL（它自己要消耗 XID，
  # 反而加剧回卷），也不必 VACUUM FREEZE（做无用功）。
  - id: vacuum_database
    action_type: vacuum_analyze
    risk_tier: CONFIRM
    template: "VACUUM {table}"
    rollback: "NO_ROLLBACK_NEEDED"
    source: pgdoc:routine-vacuuming
    doc_quote: "Execute VACUUM in the target database. A database-wide VACUUM
      is simplest. Do not use VACUUM FULL, which requires an XID."
  - id: drop_replication_slot
    action_type: replication_control
    risk_tier: CONFIRM
    template: "SELECT pg_drop_replication_slot('{slot}')"
    # 丢掉槽之后备库需要重新做基础备份，撤不回来
    rollback: "IRREVERSIBLE"
    source: pgdoc:routine-vacuuming
  - id: resolve_prepared_xact
    action_type: session_control
    risk_tier: CONFIRM
    template: "ROLLBACK PREPARED '{gid}'"
    rollback: "IRREVERSIBLE"
    source: pgdoc:routine-vacuuming
    # 护盾不放行 TransactionStmt。这是对的：了结别人的两阶段提交事务
    # 意味着替一个分布式事务的协调者做决定，agent 没有这个信息。
    # agent 可以在报告里指出该这么修，但不能提交为提案。
    execution: escalate_only
  - id: terminate_idle_backend
    action_type: session_control
    risk_tier: CONFIRM
    template: "SELECT pg_terminate_backend({pid})"
    rollback: "IRREVERSIBLE"
  - id: raise_max_wal_size
    action_type: set_parameter
    risk_tier: CONFIRM
    template: "ALTER SYSTEM SET max_wal_size = '{value}'"
    rollback: "ALTER SYSTEM RESET max_wal_size"
    source: pgdoc:monitoring-stats
    # 护盾把 ALTER SYSTEM 列为灾难动作（改全局配置且需重载）。
    # max_wal_size 是集群级设置，没有会话级的等价物 —— 也就是说
    # checkpoint_pressure 这一类**结构上就只能升级人工**。
    execution: escalate_only
  - id: raise_work_mem
    action_type: set_parameter
    risk_tier: CONFIRM
    template: "SET work_mem = '{value}'"
    rollback: "RESET work_mem"
    source: pgdoc:monitoring-stats
