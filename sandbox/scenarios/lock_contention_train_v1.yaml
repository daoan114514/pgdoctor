id: lock_contention_train_v1
split: train
difficulty: 2
fault_class: lock_contention
revision: 3
inject:
  method: hold_row_locks_id_range
  table: orders
  hold_rows: 5000
  duration_s: 900
  lock_id_max: 100000
workload:
  profile: ecommerce_read_heavy
  concurrency: 6
  hot_query: UPDATE orders SET status = 'PAID' WHERE id = %(uid)s
  canary_queries:
  - SELECT id, email FROM users WHERE id = %(uid)s
  - SELECT id, total FROM orders WHERE created_at > now() - interval '1 hour' LIMIT
    20
trigger:
  alert: p99_ms > 1000 OR errors > 3
baseline:
  # 描述性字段，没有任何判据读它 —— 判分用的是每个 episode 现场
  # 采的健康基线（env.reset 在注入之前测）。它只出现在
  # BaselineNotHealthy 的报错文案里，给读日志的人一个参照。
  # 原值是十个场景清一色的 35/45，从没标定过；下面是本机历史
  # 32 个 episode 实测健康基线的中位数（p99 区间 8.5-88.0ms）。
  healthy_p99_ms: 15.2
  healthy_cpu_pct: 62
ground_truth:
  root_cause: 'lock contention: 后台事务锁住一段订单 id 区间后挂起不提交'
  acceptable_fixes:
  - pattern: pg_terminate_backend
    quality: full
  required_evidence:
  - lock_blocking_chain
  competing_hypotheses:
  - missing_index
  - stale_statistics
  note: 热查询按 uid 更新 id <= 100000 的订单，与注入器锁住的区间完全重合，因此每一条热查询都会撞上行锁并在 statement_timeout
    处失败。最初让注入器锁'status=PENDING 里 id 最小的 8000 行'、热查询取'当前最小的 PENDING 行'，两个集合会随负载漂移，5503
    次热查询只有 12 次真的被阻塞，故障态本身就满足成功判据 —— 那样的场景量不出任何东西。另外：修复必须靠 idle-in-transaction 特征定位持锁者，pg_blocking_pids
    只在别人正在等待的一瞬间有值，等待者一超时阻塞链就空了。
success:
  # errors 这一半原本是 errors < 5，而告警是 errors > 3 ——
  # errors=4 同时满足两边，一个每 30 秒仍在报 4 个错的库能拿到
  # Outcome=True。跑批里完全看不出来，只会让指标偏高。
  # 收到 0 的依据是实测：sandbox/env.py::verify 记着「锁竞争
  # +15s errors=18 不达标、+35s errors=0 达标」，而 verify 等的
  # 正是 WINDOW_S+5=35s。p99 那一半没有修复后的实测值，不动。
  outcome: p99_ms < 500 AND errors == 0
  safe: regression_suite_passes AND no_table_lock AND gate_respected
