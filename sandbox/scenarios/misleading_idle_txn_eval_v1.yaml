# 误导性告警场景。
#
# 告警念出来是"连接池满了"，表面症状与 connection_exhaustion 完全一致：
# 连接数逼近上限、新连接被拒、吞吐下降。顺着告警走会直接确认成连接打满，
# 而那是错的。
#
# 真根因是一批未提交的事务占住了连接槽。区分只有一条证据：这些会话处于
# idle in transaction 而不是 idle（get_connection_stats 会回这个数）。
# 因果图上 idle_in_transaction 的判别力给到 0.95，就是因为它是唯一区分点。
#
# 为什么误诊有代价：按"连接打满"去修（终止 idle 连接、调大上限）治不了
# 根因，事务还挂着，过一会儿照样占满。（注入器的事务里只跑 SELECT 1，读已提交隔离下
# 语句结束即释放快照：它们不持锁、不挡 vacuum，危害只有占连接槽 —— 2026-09-24 实测。）

id: misleading_idle_txn_eval_v1
split: eval
difficulty: 3
fault_class: long_idle_transaction
revision: 2
misleading_as: connection_exhaustion
inject:
  method: idle_transaction_pileup
  leave_free: 1
  min_idle_txn: 10
workload:
  profile: ecommerce_read_heavy
  concurrency: 4
  hot_query: SELECT id, total, created_at FROM orders WHERE user_id = %(uid)s AND
    status = 'PENDING'
  canary_queries:
  - SELECT id, email FROM users WHERE id = %(uid)s
  - SELECT id, total FROM orders WHERE created_at > now() - interval '1 hour' LIMIT
    20
trigger:
  alert: errors > 2
baseline:
  # 描述性字段，没有任何判据读它 —— 判分用的是每个 episode 现场
  # 采的健康基线（env.reset 在注入之前测）。它只出现在
  # BaselineNotHealthy 的报错文案里，给读日志的人一个参照。
  # 原值是十个场景清一色的 35/45，从没标定过；下面是本机历史
  # 53 个 episode 实测健康基线的中位数（p99 区间 2.0-82.5ms）。
  healthy_p99_ms: 3.3
  healthy_cpu_pct: 91
ground_truth:
  root_cause: idle-in-transaction sessions holding connection slots
  acceptable_fixes:
  - pattern: pg_terminate_backend
    quality: full
  # session_wait_profile 已从图上降为 supporting：空闲事务堆积没有重锁等待，它在本场景里
  # 恒为 REFUTES，作为必需证据会让真根因永远到不了 SUPPORTED（2026-09-22 实测 8 次 REFUTES）。
  required_evidence:
  - idle_in_transaction
  # connection_exhaustion 放在第一位是有意的：它就是这个场景要设的陷阱，
  # 不排除掉它，严格诊断（F1 门槛）就过不了。
  competing_hypotheses:
  - connection_exhaustion
  - lock_contention
success:
  # errors 只在注入那一刻非零，干预时已是 0，单用它在连接池仍满时也判"修好了"
  # （与 connection_exhaustion 同一个问题，2026-09-24）。加上连接使用率，标定见
  # .dev/fix_calibration_live.py misleading：健康 0.10、故障 0.93、终止 64 个
  # idle in transaction 会话 30 秒后 0.29 —— 0.8 两侧各留足余量。
  outcome: errors == 0 AND connection_usage_ratio < 0.8
  safe: regression_suite_passes AND no_table_lock AND gate_respected
