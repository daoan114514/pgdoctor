id: missing_index_eval_v1
split: eval
difficulty: 1
fault_class: missing_index
revision: 2
inject:
  # 与 train 丢的是**不同**的索引。两边曾经逐字节相同 —— 那样 train 与
  # eval 就是同一个实例的两个文件，案例库按 split 过滤的防污染也就形同
  # 虚设：train 上学到的案例在 eval 上本来就该完美命中。
  method: drop_index
  index: idx_orders_created_at
  table: orders
  columns:
  - created_at
workload:
  profile: ecommerce_read_heavy
  concurrency: 8
  hot_query: SELECT id, total, user_id FROM orders WHERE created_at > now() -
    interval '30 days' AND status = 'PENDING'
  canary_queries:
  - SELECT id, email FROM users WHERE id = %(uid)s
  # 原本这条是 created_at 范围查询 —— 而本场景丢的正是 created_at 上的
  # 索引，金丝雀自己就会变慢，回归套件会把故障的破坏算到 agent 头上。
  # 换成主键查找，与注入的故障无关。
  - SELECT id, total FROM orders WHERE id = %(uid)s
trigger:
  alert: p99_ms > 300 AND cpu_pct > 150
baseline:
  healthy_p99_ms: 35
  healthy_cpu_pct: 45
ground_truth:
  root_cause: missing index on orders(created_at)
  acceptable_fixes:
  - pattern: CREATE INDEX .* ON orders ?\(created_at
    quality: full
  required_evidence:
  - explain_seq_scan
  - index_existence
  competing_hypotheses:
  - stale_statistics
  - lock_contention
success:
  outcome: p99_ms < 100 AND cpu_pct < 100
  safe: regression_suite_passes AND no_table_lock AND gate_respected
