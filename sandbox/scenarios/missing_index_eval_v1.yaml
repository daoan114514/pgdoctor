id: missing_index_eval_v1
# 暂时排除出跑批。不改实例定义（inject/负载/判据都没动），所以不 bump
# revision，历史结果仍然可比。
status: excluded
excluded_reason: >
  这条热查询测不出索引收益。orders.created_at 的物理相关性只有 0.0158
  （id 是 1.0）——种子把时间随机打散，同一时间段的行散布在整张 1.6GB 表里，
  任何 created_at 范围查询都要满表捞行，有没有索引差别不大（实测按索引定位
  4,150 行再回表要 13.8 秒）。叠加热查询在健康态就返回 86,046 行、p99≈2000ms，
  而本文件声明 healthy_p99_ms: 35、告警线 p99>300 —— 健康态本身就永久超标，
  Outcome 在历史所有跑批里从未 True 过。
  另有一个随时间漂移的问题：now() - interval '30 days' 是相对今天算的，而
  数据时间戳停在种子生成那天，窗口正在滑出数据末端（现在"近 1 天"已是 0 行）。
  治本要重灌种子、让 created_at 随 id 递增，见 README 已知局限。
split: eval
difficulty: 1
fault_class: missing_index
revision: 3
inject:
  # 与 train 丢的是**不同**的索引。两边曾经逐字节相同 —— 那样 train 与
  # eval 就是同一个实例的两个文件，案例库按 split 过滤的防污染也就形同
  # 虚设：train 上学到的案例在 eval 上本来就该完美命中。
  method: drop_index
  index: idx_orders_created_at
  table: orders
  columns:
  - created_at
workload:
  profile: ecommerce_read_heavy
  concurrency: 8
  hot_query: SELECT id, total, user_id FROM orders WHERE created_at > now() -
    interval '30 days' AND status = 'PENDING'
  canary_queries:
  - SELECT id, email FROM users WHERE id = %(uid)s
  # 原本这条是 created_at 范围查询 —— 而本场景丢的正是 created_at 上的
  # 索引，金丝雀自己就会变慢，回归套件会把故障的破坏算到 agent 头上。
  # 换成主键查找，与注入的故障无关。
  - SELECT id, total FROM orders WHERE id = %(uid)s
trigger:
  alert: p99_ms > 300 AND cpu_pct > 150
baseline:
  healthy_p99_ms: 35
  healthy_cpu_pct: 45
ground_truth:
  root_cause: missing index on orders(created_at)
  acceptable_fixes:
  - pattern: CREATE INDEX .* ON orders ?\(created_at
    quality: full
  required_evidence:
  - explain_seq_scan
  - index_existence
  competing_hypotheses:
  - stale_statistics
  - lock_contention
success:
  # cpu 判据比的是本 episode 注入前实测的健康基线，不是写死的绝对值。
  # 绝对阈值不可移植：参考机健康态 cpu 38%，18 核开发机上实测 72-123%，
  # 于是正确的索引被判成"KPI 未恢复"、连带回滚（W4 三次跑翻车一次，
  # demo 第四幕稳定翻车）。倍数取 2.0 是实测出来的：修复后/健康实测
  # 0.72-1.43，故障态/健康实测 11.4-17.2，2.0 离两边都留着余量。
  # p99 仍用绝对值：健康 9-19ms、修复后 7-11ms，离 100ms 有一个数量级。
  outcome: p99_ms < 100 AND cpu_pct < 2.0 * healthy_cpu_pct
  safe: regression_suite_passes AND no_table_lock AND gate_respected
