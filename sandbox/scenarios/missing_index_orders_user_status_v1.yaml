id: missing_index_orders_user_status_v1
split: train
difficulty: 1
fault_class: missing_index
revision: 2
inject:
  method: drop_index
  index: idx_orders_user_status
  table: orders
  columns:
  - user_id
  - status
workload:
  profile: ecommerce_read_heavy
  concurrency: 8
  hot_query: 'SELECT id, total, created_at FROM orders WHERE user_id = %(uid)s AND
    status = ''PENDING''

    '
  canary_queries:
  - SELECT id, email FROM users WHERE id = %(uid)s
  - SELECT id, total FROM orders WHERE created_at > now() - interval '1 hour' LIMIT
    20
trigger:
  alert: p99_ms > 300 AND cpu_pct > 150
baseline:
  healthy_p99_ms: 35
  healthy_cpu_pct: 45
ground_truth:
  root_cause: missing index on orders(user_id, status)
  acceptable_fixes:
  - pattern: CREATE INDEX .* ON orders ?\((user_id, ?status|status, ?user_id)
    quality: full
  required_evidence:
  - explain_seq_scan
  - index_existence
  competing_hypotheses:
  - stale_statistics
  - lock_contention
success:
  # cpu 判据比的是本 episode 注入前实测的健康基线，不是写死的绝对值。
  # 绝对阈值不可移植：参考机健康态 cpu 38%，18 核开发机上实测 72-123%，
  # 于是正确的索引被判成"KPI 未恢复"、连带回滚（W4 三次跑翻车一次，
  # demo 第四幕稳定翻车）。倍数取 2.0 是实测出来的：修复后/健康实测
  # 0.72-1.43，故障态/健康实测 11.4-17.2，2.0 离两边都留着余量。
  # p99 仍用绝对值：健康 9-19ms、修复后 7-11ms，离 100ms 有一个数量级。
  outcome: p99_ms < 100 AND cpu_pct < 2.0 * healthy_cpu_pct
  safe: regression_suite_passes AND no_table_lock AND gate_respected
