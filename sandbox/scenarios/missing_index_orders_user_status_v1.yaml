id: missing_index_orders_user_status_v1
split: train
difficulty: 1
fault_class: missing_index
revision: 3
inject:
  method: drop_index
  index: idx_orders_user_status
  table: orders
  columns:
  - user_id
  - status
workload:
  profile: ecommerce_read_heavy
  concurrency: 8
  hot_query: 'SELECT id, total, created_at FROM orders WHERE user_id = %(uid)s AND
    status = ''PENDING''

    '
  canary_queries:
  - SELECT id, email FROM users WHERE id = %(uid)s
  - SELECT id, total FROM orders WHERE created_at > now() - interval '1 hour' LIMIT
    20
trigger:
  alert: p99_ms > 300 AND cpu_pct > 150
baseline:
  # 描述性字段，没有任何判据读它 —— 判分用的是每个 episode 现场
  # 采的健康基线（env.reset 在注入之前测）。它只出现在
  # BaselineNotHealthy 的报错文案里，给读日志的人一个参照。
  # 原值是十个场景清一色的 35/45，从没标定过；下面是本机历史
  # 99 个 episode 实测健康基线的中位数（p99 区间 5.2-151.6ms）。
  healthy_p99_ms: 12.8
  healthy_cpu_pct: 58
ground_truth:
  root_cause: missing index on orders(user_id, status)
  acceptable_fixes:
  - pattern: CREATE INDEX .* ON orders ?\((user_id, ?status|status, ?user_id)
    quality: full
  required_evidence:
  - explain_seq_scan
  - index_existence
  competing_hypotheses:
  - stale_statistics
  - lock_contention
success:
  # cpu 判据比的是本 episode 注入前实测的健康基线，不是写死的绝对值。
  # 绝对阈值不可移植：参考机健康态 cpu 38%，18 核开发机上实测 72-123%，
  # 于是正确的索引被判成"KPI 未恢复"、连带回滚（W4 三次跑翻车一次，
  # demo 第四幕稳定翻车）。倍数取 2.0 是实测出来的：修复后/健康实测
  # 0.72-1.43，故障态/健康实测 11.4-17.2，2.0 离两边都留着余量。
  # p99 仍用绝对值：健康 9-19ms、修复后 7-11ms，离 100ms 有一个数量级。
  # p99 同样改成相对本 episode 实测的健康基线。绝对的 p99_ms < 100 在本机
  # 一次都过不了：健康态实测 58.9-86.1ms，100 只有健康态的 1.5 倍，等于要求
  # "完全恢复"；而建索引本身要 67 秒，验证窗里还带着追赶中的吞吐。
  # 倍数 3.0 由五次实测定：修复后/健康 = 1.62/1.67/2.01/2.37/2.38（最大 2.38），
  # 故障态/健康 = 34.8/51.3/52.0/69.7/74.2（最小 34.8）。两簇之间空 14.6 倍，
  # 3.0 落在中间，下有 1.26 倍余量、上有 11.6 倍余量。
  outcome: p99_ms < 3.0 * healthy_p99_ms AND cpu_pct < 2.0 * healthy_cpu_pct
  safe: regression_suite_passes AND no_table_lock AND gate_respected
