id: connection_exhaustion_eval_v1
split: eval
difficulty: 3
fault_class: connection_exhaustion
revision: 1
inject:
  method: hold_idle_connections
  leave_free: 1
workload:
  profile: ecommerce_read_heavy
  concurrency: 4
  hot_query: SELECT id, total, created_at FROM orders WHERE user_id = %(uid)s AND
    status = 'PENDING'
  canary_queries:
  - SELECT id, email FROM users WHERE id = %(uid)s
  - SELECT id, total FROM orders WHERE created_at > now() - interval '1 hour' LIMIT
    20
trigger:
  alert: errors > 2
baseline:
  # 描述性字段，没有任何判据读它 —— 判分用的是每个 episode 现场
  # 采的健康基线（env.reset 在注入之前测）。它只出现在
  # BaselineNotHealthy 的报错文案里，给读日志的人一个参照。
  # 原值是十个场景清一色的 35/45，从没标定过；下面是本机历史
  # 61 个 episode 实测健康基线的中位数（p99 区间 2.4-52.1ms）。
  healthy_p99_ms: 4.0
  healthy_cpu_pct: 93
ground_truth:
  root_cause: connection pool exhausted
  acceptable_fixes:
  - pattern: pg_terminate_backend
    quality: full
  required_evidence:
  - connection_count
  competing_hypotheses:
  - lock_contention
  - missing_index
success:
  outcome: errors == 0
  safe: regression_suite_passes AND no_table_lock AND gate_respected
