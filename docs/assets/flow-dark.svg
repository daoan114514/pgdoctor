<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="pgdoctor 一次诊断的完整流程：告警、观察、列假设、取证、诊断之后，由 ESC 判断证据够不够；够了才写修复方案，经安全门放行后执行，再验证是否真的好了。Claude 只在取证（设计候选索引）和写方案两处出手，只有执行和回滚会写库。" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>pgdoctor 一次诊断的完整流程：告警、观察、列假设、取证、诊断之后，由 ESC 判断证据够不够；够了才写修复方案，经安全门放行后执行，再验证是否真的好了。Claude 只在取证（设计候选索引）和写方案两处出手，只有执行和回滚会写库。</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6e7681"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3fb950"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="499" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<rect x="66" y="102" width="104" height="56" rx="10" fill="#2c171b" stroke="#da3633" stroke-width="1.3"/>
<text x="118" y="127" font-size="15" fill="#ff7b72" font-weight="600" text-anchor="middle">告警</text>
<text x="118" y="146" font-size="12" fill="#9198a1" text-anchor="middle">KPI 越线</text>
<rect x="204" y="102" width="104" height="56" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.3"/>
<text x="256" y="127" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="middle">观察</text>
<text x="256" y="146" font-size="12" fill="#9198a1" text-anchor="middle">KPI → 症状</text>
<rect x="342" y="102" width="104" height="56" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.3"/>
<text x="394" y="127" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="middle">列假设</text>
<text x="394" y="146" font-size="12" fill="#9198a1" text-anchor="middle">因果图反查</text>
<rect x="480" y="102" width="104" height="56" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.3"/>
<text x="532" y="127" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="middle">取证</text>
<text x="532" y="146" font-size="12" fill="#9198a1" text-anchor="middle">规则判方向</text>
<rect x="618" y="102" width="104" height="56" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.3"/>
<text x="670" y="127" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="middle">诊断</text>
<text x="670" y="146" font-size="12" fill="#9198a1" text-anchor="middle">选出解释路径</text>
<polygon points="750,130 764,100 852,100 866,130 852,160 764,160" fill="#272215" stroke="#9e6a03" stroke-width="1.6" stroke-linejoin="round"/>
<text x="808" y="127" font-size="15" fill="#e3b341" font-weight="700" text-anchor="middle">ESC</text>
<text x="808" y="146" font-size="12" fill="#9198a1" text-anchor="middle">证据够吗？</text>
<rect x="543.24" y="93.5" width="46.76" height="17" rx="8.5" fill="#201c36" stroke="#8957e5" stroke-width="1"/>
<text x="566.62" y="105.6" font-size="10.5" fill="#bc8cff" font-weight="600" text-anchor="middle">Claude</text>
<path d="M171,130 L202,130" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M309,130 L340,130" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M447,130 L478,130" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M585,130 L616,130" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M723,130 L748,130" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M808,99 C808,48 532,48 532,100" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="670" y="52" font-size="12" fill="#9198a1" text-anchor="middle">不够：列出缺的证据，再取一轮</text>
<rect x="66" y="282" width="104" height="56" rx="10" fill="#201c36" stroke="#8957e5" stroke-width="1.3"/>
<text x="118" y="307" font-size="15" fill="#bc8cff" font-weight="600" text-anchor="middle">方案</text>
<text x="118" y="326" font-size="12" fill="#9198a1" text-anchor="middle">写修复 SQL</text>
<rect x="129.24" y="273.5" width="46.76" height="17" rx="8.5" fill="#201c36" stroke="#8957e5" stroke-width="1"/>
<text x="152.62" y="285.6" font-size="10.5" fill="#bc8cff" font-weight="600" text-anchor="middle">Claude</text>
<polygon points="198,310 212,280 300,280 314,310 300,340 212,340" fill="#272215" stroke="#9e6a03" stroke-width="1.6" stroke-linejoin="round"/>
<text x="256" y="307" font-size="15" fill="#e3b341" font-weight="700" text-anchor="middle">安全门</text>
<text x="256" y="326" font-size="12" fill="#9198a1" text-anchor="middle">能不能做？</text>
<text x="256" y="356" font-size="10.5" fill="#6e7681" text-anchor="middle">AUTO / CONFIRM / DENY</text>
<rect x="342" y="282" width="104" height="56" rx="10" fill="#2c1f1a" stroke="#bd561d" stroke-width="1.3"/>
<text x="394" y="307" font-size="15" fill="#ffa657" font-weight="600" text-anchor="middle">执行</text>
<text x="394" y="326" font-size="12" fill="#9198a1" text-anchor="middle">先记回滚日志</text>
<polygon points="474,310 488,280 576,280 590,310 576,340 488,340" fill="#272215" stroke="#9e6a03" stroke-width="1.6" stroke-linejoin="round"/>
<text x="532" y="307" font-size="15" fill="#e3b341" font-weight="700" text-anchor="middle">验证</text>
<text x="532" y="326" font-size="12" fill="#9198a1" text-anchor="middle">真的好了吗？</text>
<rect x="618" y="282" width="104" height="56" rx="10" fill="#12261e" stroke="#2ea043" stroke-width="1.3"/>
<text x="670" y="307" font-size="15" fill="#3fb950" font-weight="600" text-anchor="middle">完成</text>
<text x="670" y="326" font-size="12" fill="#9198a1" text-anchor="middle">出诊断报告</text>
<rect x="756" y="282" width="104" height="56" rx="10" fill="#21262d" stroke="#484f58" stroke-width="1.3"/>
<text x="808" y="307" font-size="15" fill="#c9d1d9" font-weight="600" text-anchor="middle">交给人</text>
<text x="808" y="326" font-size="12" fill="#9198a1" text-anchor="middle">附上缺什么</text>
<path d="M171,310 L196,310" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M315,310 L340,310" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M447,310 L472,310" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M591,310 L616,310" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M808,161 L808,205" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M808,205 H38 Q30,205 30,213 V302 Q30,310 38,310 H64" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ok)"/>
<path d="M808,205 L808,280" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<circle cx="808" cy="205" r="3.2" fill="#6e7681"/>
<text x="463" y="197" font-size="12" fill="#3fb950" font-weight="600" text-anchor="middle">✓ 证据充分，才轮到修</text>
<text x="800" y="250" font-size="12" fill="#9198a1" text-anchor="end">分不清 / 取不到</text>
<path d="M256,279 C256,236 110,236 110,280" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="193" y="240" font-size="12" fill="#9198a1" text-anchor="middle">DENY：打回重写</text>
<path d="M532,341 C532,425 128,425 128,340" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="300" y="390.875" width="60" height="26" rx="13" fill="#2c1f1a" stroke="#bd561d" stroke-width="1.3"/>
<text x="330" y="408.375" font-size="13" fill="#ffa657" font-weight="600" text-anchor="middle">回滚</text>
<text x="330" y="438" font-size="12" fill="#9198a1" text-anchor="middle">没好：按作用域回滚，换个方案</text>
<polygon points="75.96,474 81.96,466 95.96,466 101.96,474 95.96,482 81.96,482" fill="#272215" stroke="#9e6a03" stroke-width="1.3"/>
<text x="109.96" y="478.3" font-size="12" fill="#9198a1">规则把关的关卡</text>
<rect x="219.96" y="466" width="26" height="16" rx="5" fill="#201c36" stroke="#8957e5" stroke-width="1.2"/>
<text x="253.96" y="478.3" font-size="12" fill="#9198a1">Claude 出手的地方</text>
<rect x="381" y="466" width="26" height="16" rx="5" fill="#2c1f1a" stroke="#bd561d" stroke-width="1.2"/>
<text x="415" y="478.3" font-size="12" fill="#9198a1">写库（只有安全门能做）</text>
<path d="M573,474 L597,474" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="607" y="478.3" font-size="12" fill="#9198a1">回退</text>
<text x="657" y="478.3" font-size="12" fill="#6e7681">其余步骤全程只读 · agent_ro</text>
</svg>
